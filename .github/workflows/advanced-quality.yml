# Calls the centrally reviewed workflow at an immutable commit SHA.
name: Advanced quality — fuzzing and benchmarks
'on':
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advanced-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: Neguchads/codex-config-universal/.github/workflows/reusable-advanced-quality.yml@a4c9e61860019e727d5b689e3d1c64ee4d42148a
    with:
      stack: python
