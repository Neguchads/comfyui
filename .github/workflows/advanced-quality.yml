# Calls the centrally reviewed workflow at an immutable commit SHA.
name: Advanced quality — fuzzing and benchmarks
'on':
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advanced-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: Neguchads/codex-config-universal/.github/workflows/reusable-advanced-quality.yml@e8a8134e2621a0041b966ea4ed613b52472cec55
    with:
      stack: python
