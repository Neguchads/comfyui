# Audit GitHub Actions definitions without altering application code.
name: Workflow security (zizmor)
'on':
  pull_request:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - ".github/zizmor.yml"
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-audit:
    name: Audit workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3 # v0.9.0
        with:
          version: "1.32.0"
          strict-collection: true
